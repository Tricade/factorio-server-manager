name: Export private container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GHCR tag to export
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and resolve image name
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container tag" >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export published linux/amd64 image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE:$TAG"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$(docker image inspect "$IMAGE:$TAG" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$TAG"
          fi
          docker save --output "factorio-server-manager-$TAG.tar" "$IMAGE:$TAG"
          sha256sum "factorio-server-manager-$TAG.tar" > "factorio-server-manager-$TAG.tar.sha256"
      - name: Upload short-lived private image archive
        uses: actions/upload-artifact@v7
        with:
          name: factorio-server-manager-${{ steps.image.outputs.tag }}-docker-image
          path: |
            factorio-server-manager-${{ steps.image.outputs.tag }}.tar
            factorio-server-manager-${{ steps.image.outputs.tag }}.tar.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
