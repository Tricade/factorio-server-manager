name: Test

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test-npm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use the Ubuntu archive for browser system dependencies
        run: |
          # The hosted runner's regional Azure mirror can stall until this job times out.
          # Keep Ubuntu's signed repositories; change only the ephemeral runner mirror.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Retain synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
  test-go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: test-go (${{ matrix.os }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - if: contains(matrix.os, 'ubuntu')
        working-directory: src
        run: |
          go version | grep -F 'go1.26.10 '
          go test ./... -short -count=1
          go test ./... -race -short -count=1
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - if: contains(matrix.os, 'windows')
        working-directory: src
        run: go test ./... -short -count=1
  test-unraid-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Community Applications metadata
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/validate-unraid-template.py
          python3 scripts/validate-source-layout.py
  docker-build:
    needs: [test-npm, test-go, test-unraid-template, test-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test replacement operations on mounted Factorio directories
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/src",target=/workspace,readonly \
            --mount type=tmpfs,destination=/opt/factorio \
            --mount type=tmpfs,destination=/opt/factorio/mods \
            --env FSM_TEST_MOUNTED_FACTORIO_DIR=/opt/factorio \
            --env FSM_TEST_MOUNTED_MODS_DIR=/opt/factorio/mods \
            --workdir /workspace \
            golang:1.26.10-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af \
            go test ./factorio -run '^(TestDeleteAllModsAtMountedDestination|TestReplaceModsFromSaveAtMountedDestination|TestReplaceReleaseFilesAtMountedDestination|TestModStartupSettingsAtomicWriteAtMountedDestination|TestRestoreModBackupAtMountedDestination|TestMergeModPackAtMountedDestination)$' -count=1 -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.registry
          platforms: linux/amd64
          push: false
          load: true
          tags: factorio-server-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reject missing persistent mounts
        shell: bash
        run: |
          set +e
          output=$(docker run --rm factorio-server-manager:ci 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          grep -F '/opt/fsm-data is not a persistent bind mount or named volume' <<<"$output"
          test "$(docker image inspect factorio-server-manager:ci --format '{{json .Config.Volumes}}')" = "null"
          ! grep -F 'Target="/opt/factorio"' templates/factorio-server-manager.xml
      - name: Accept split Unraid game-data mounts
        run: |
          docker run --rm \
            --mount type=tmpfs,destination=/opt/fsm-data \
            --mount type=tmpfs,destination=/opt/factorio/saves \
            --mount type=tmpfs,destination=/opt/factorio/mods \
            --mount type=tmpfs,destination=/opt/factorio/config \
            factorio-server-manager:ci true
      - name: Real-engine lifecycle with combined persistent storage
        run: python3 scripts/test-container-lifecycle.py --disposable --version 2.0.77 --mode factorio --layout combined
      - name: Real-engine lifecycle with split Unraid storage and Space Age
        run: python3 scripts/test-container-lifecycle.py --disposable --version 2.1.20 --mode space-age --layout split
