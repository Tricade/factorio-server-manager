name: Test

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
jobs:
  test-npm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  test-go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: test-go (${{ matrix.os }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - if: contains(matrix.os, 'ubuntu')
        working-directory: src
        run: |
          go version | grep -F 'go1.25.14 '
          go test ./... -short -count=1
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - if: contains(matrix.os, 'windows')
        working-directory: src
        run: go test ./... -short -count=1
  test-unraid-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Community Applications metadata
        run: python3 scripts/validate-unraid-template.py
  docker-build:
    needs: [test-npm, test-go, test-unraid-template]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test replacement operations on mounted Factorio directories
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/src",target=/workspace,readonly \
            --mount type=tmpfs,destination=/opt/factorio \
            --mount type=tmpfs,destination=/opt/factorio/mods \
            --env FSM_TEST_MOUNTED_FACTORIO_DIR=/opt/factorio \
            --env FSM_TEST_MOUNTED_MODS_DIR=/opt/factorio/mods \
            --workdir /workspace \
            golang:1.25.14-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437 \
            go test ./factorio -run '^(TestDeleteAllModsAtMountedDestination|TestReplaceReleaseFilesAtMountedDestination)$' -count=1 -v
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build production container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.registry
          platforms: linux/amd64
          push: false
          load: true
          tags: factorio-server-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reject missing persistent mounts
        shell: bash
        run: |
          set +e
          output=$(docker run --rm factorio-server-manager:ci 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          grep -F '/opt/fsm-data is not a persistent bind mount or named volume' <<<"$output"
          test "$(docker image inspect factorio-server-manager:ci --format '{{json .Config.Volumes}}')" = "null"
          ! grep -F 'Target="/opt/factorio"' templates/factorio-server-manager.xml
      - name: Accept split Unraid game-data mounts
        run: |
          docker run --rm \
            --mount type=tmpfs,destination=/opt/fsm-data \
            --mount type=tmpfs,destination=/opt/factorio/saves \
            --mount type=tmpfs,destination=/opt/factorio/mods \
            --mount type=tmpfs,destination=/opt/factorio/config \
            factorio-server-manager:ci true
