name: Publish container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Non-release container tag to publish
        required: true
        default: edge
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Validate tag and resolve image name
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container tag" >&2
            exit 1
          fi
          if [[ "$REQUESTED_TAG" == latest || "$REQUESTED_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest and immutable SemVer tags are published only by the release workflow" >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.registry
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: |
            BUILD_DATE=${{ steps.image.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ steps.image.outputs.tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
