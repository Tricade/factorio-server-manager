services:
  factorio-server-manager:
    image: "${FSM_IMAGE:?Set FSM_IMAGE to the complete registry image reference}"
    container_name: "factorio-server-manager"
    restart: "unless-stopped"
    stop_grace_period: "3m"
    environment:
      FACTORIO_VERSION: "${FACTORIO_VERSION:?Set FACTORIO_VERSION to stable, latest or an exact version}"
      FSM_MAX_UPLOAD: "${FSM_MAX_UPLOAD:-512}"
      FSM_COOKIE_SECURE: "${FSM_COOKIE_SECURE:-false}"
      RCON_PASS: "${RCON_PASS:-}"
    ports:
      - "${FSM_HTTP_PORT:-8080}:80/tcp"
      - "${FACTORIO_PORT:-34197}:34197/udp"
    volumes:
      - "./fsm-data:/opt/fsm-data"
      - "./factorio-data:/opt/factorio"
