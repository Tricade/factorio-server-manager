services:
  factorio-server-manager:
    build:
      context: ".."
      dockerfile: "docker/Dockerfile-local"
    image: "factorio-server-manager:local"
    container_name: "factorio-server-manager"
    restart: "unless-stopped"
    stop_grace_period: "3m"
    environment:
      - "FACTORIO_VERSION=${FACTORIO_VERSION:?Set FACTORIO_VERSION to stable, latest or an exact version}"
      - "FSM_COOKIE_SECURE=${FSM_COOKIE_SECURE:-false}"
      - "RCON_PASS=${RCON_PASS:-}"
    ports:
      - "80:80"
      - "34197:34197/udp"
    volumes:
      - "./fsm-data:/opt/fsm-data"
      - "./factorio-data/saves:/opt/factorio/saves"
      - "./factorio-data/mods:/opt/factorio/mods"
      - "./factorio-data/config:/opt/factorio/config"
